<title>Hải Trình Vạn Đảo</title>
<style>
:root{--glass:rgba(10,20,36,.58);--line:rgba(255,255,255,.14);--txt:#eef6ff;--mut:#a9bfd6;--acc:#ffd27a;--good:#7be0a0;--bad:#ff8a8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1530;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--txt)}
canvas{display:block}
.glass{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px}
#stats{position:fixed;top:12px;left:12px;width:228px;padding:9px 12px;font-size:12px}
#gold{font-size:18px;font-weight:700;color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;margin:2px 0;gap:8px}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.bar{height:5px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin:2px 0 6px}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .2s}
#mapbox{position:fixed;top:12px;right:12px;padding:6px}
#mini{border-radius:10px}
#mapbox .cap{font-size:11px;color:var(--mut);text-align:center;margin-top:4px}
#nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 20px;display:flex;gap:22px;align-items:center;font-size:13px;white-space:nowrap}
#nav b{font-size:20px}
.thr{display:flex;gap:3px;align-items:flex-end}
.thr i{width:10px;height:18px;border-radius:3px;background:rgba(255,255,255,.15)}
.thr i.on{background:var(--acc)}
.thr i.rev.on{background:var(--bad)}
.sm{font-size:11.5px;color:var(--mut)}
#prompt{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:9px 18px;font-size:15px;display:none}
#talk{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);padding:10px 18px;font-size:14px;display:none;max-width:62vw;text-align:center;line-height:1.5}
#hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:7px 16px;font-size:13px;display:none;color:#fff7dc;max-width:46vw;text-align:center}
#toasts{position:fixed;top:62px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
.toast{padding:8px 16px;font-size:14px;animation:tin .3s ease-out;max-width:60vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
#help{position:fixed;bottom:12px;left:12px;padding:6px 10px;font-size:11px;color:var(--mut);line-height:1.55;max-width:min(620px,60vw)}
kbd{background:rgba(255,255,255,.14);border-radius:4px;padding:0 5px;color:var(--txt);font-family:inherit;font-size:11px}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,10,20,.45);z-index:10}
#modal.show{display:flex}
#modal .panel{width:min(880px,94vw);max-height:88vh;overflow:auto;padding:20px 24px;background:rgba(12,22,40,.92)}
#modal.side{justify-content:flex-end;align-items:flex-start;background:transparent;pointer-events:none}
#modal.side .panel{pointer-events:auto;width:min(520px,94vw);max-height:calc(100vh - 28px);margin:14px;background:rgba(12,22,40,.86)}
h2{margin:0 0 2px;font-size:24px}
h3{margin:0 0 12px;font-weight:400;color:var(--mut);font-size:14px}
h4{margin:16px 0 6px;font-size:14px;color:var(--acc)}
p{line-height:1.55}
.npc{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin:8px 0}
.npc .ic{font-size:34px;line-height:1}
.npc .nm{font-weight:700;font-size:16px}
.npc .q{color:var(--mut);font-style:italic;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
button{font:inherit;color:var(--txt);background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){background:rgba(255,255,255,.2)}
button:disabled{opacity:.35;cursor:not-allowed}
button.pri{background:#d9922e;border-color:#f0b65a;color:#1b1206;font-weight:700}
button.pri:hover:not(:disabled){background:#efa940}
.tabs button.on{background:var(--acc);color:#1b1206;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:400;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.12);margin-left:4px;white-space:nowrap}
.tag.hot{background:#c0392b}
.tag.cheap{background:#2e7d4f}
.card{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choices button{text-align:left;padding:10px 14px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.good{color:var(--good)}.bad{color:var(--bad)}
#bigmap{width:min(640px,80vw);height:min(640px,80vw);border-radius:12px;display:block;margin:10px auto}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--mut)}
#fade{position:fixed;inset:0;background:#06101e;opacity:0;pointer-events:none;transition:opacity .45s;z-index:30}
.creator{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
#pv{width:240px;height:300px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#2c4f74,#0d1b30)}
.opt{margin:8px 0}
.opt .sm{margin-bottom:4px}
.sw{display:inline-block;width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;margin:2px;vertical-align:middle}
.sw.on{border-color:#fff}
input[type=text]{font:inherit;color:var(--txt);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:9px;padding:8px 12px;width:100%}
#qtrack{position:fixed;right:12px;bottom:12px;padding:7px 10px;font-size:11.5px;max-width:280px;display:none;line-height:1.55}
#banner{position:fixed;top:20%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:800;text-shadow:0 3px 14px rgba(0,0,0,.7);opacity:0;transition:opacity .5s;pointer-events:none;z-index:6;text-align:center;white-space:nowrap}
#catch{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);width:min(460px,92vw);padding:16px 20px;text-align:center;display:none;z-index:15;opacity:0;transition:opacity .35s,transform .35s;cursor:pointer}
#catch.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#catchcv{width:100%;height:auto;aspect-ratio:440/240;border-radius:12px;background:radial-gradient(circle at 50% 45%,#2c6f9a,#0b2440);display:block;margin:8px 0}
#catch .stars{color:#ffd27a;font-size:24px;letter-spacing:4px}
#catch h2{margin:6px 0 2px}
#fishbar{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);width:360px;padding:12px 16px;display:none;text-align:center;font-size:14px}
#fishbar .track{position:relative;height:18px;background:rgba(255,255,255,.12);border-radius:9px;margin-top:8px;overflow:hidden}
#fishbar .zone{position:absolute;top:0;bottom:0;background:rgba(123,224,160,.75);border-radius:9px}
#fishbar .mark{position:absolute;top:0;width:6px;height:18px;background:#ffd27a;border-radius:3px;box-shadow:0 0 8px #ffd27a}
</style>
</head>

function discoverR(){return 300*(1+0.15*Math.min(4,jobLv('nav')))*(1-0.5*WX.fog);}

    ship:{x:islands[0].x+400,z:islands[0].z,h:0,speed:0,thr:0},

    case 'carry': aLx=-1.25; aRx=-1.25; aLz=0.25; aRz=-0.25; legA=Math.sin(t*3)*0.25; bob=Math.abs(Math.sin(t*3))*0.04; break;

function priceMult(ik,id){ const it=ITEMS[id]; if(it.origin==='sea') return {flora:1.3,desert:1.2,coral:0.85}[ik]; if(it.origin==='ship') return id==='thao'?1:(ik==='desert'?1.4:1.1); if(it.origin===ik) return 0.5; if(SCARCE_AT[it.origin]===ik) return 2.0; if(SCARCE2[it.origin]===ik) return 1.4; return 1.0; }

function sellPrice(ik,id){ return Math.max(1,Math.round(basePrice(ik,id)*(1+(S.rep[ik]||0)*0.001))); }
function buyPrice(ik,id){ return Math.max(2,Math.round(basePrice(ik,id)*1.18*(1-(S.rep[ik]||0)*0.001))); }
function addCargo(id,q,f=1){ const c=S.cargo[id]||{q:0,f:1}; const n=c.q+q; c.f=(c.f*c.q+f*q)/n; c.q=n; S.cargo[id]=c; }
function removeCargo(id,q){ const c=S.cargo[id]; if(!c) return; c.q-=q; if(c.q<=0) delete S.cargo[id]; }
function itemSellValue(ik,id){ const c=S.cargo[id]; const f=ITEMS[id].perish&&c?Math.max(0.2,c.f):1; return Math.max(1,Math.round(sellPrice(ik,id)*f)); }

function serviceAction(a,ds){
  const ik=curIsland;

  if(a==='sell'){ const id=ds.id; let n=+ds.n; const m=S.market[ik][id]; while(n-->0&&S.cargo[id]){ S.gold+=itemSellValue(ik,id); removeCargo(id,1); m.sat*=0.92; S.stats.trades++; } }
  if(a==='repair'){ S.gold-=repairCost(ik); S.hull=tier().hull; toast('🛠️ Thuyền đã được sửa như mới!'); }
  if(a==='repairmat'){ S.gold-=Math.ceil(repairCost(ik)*0.65); removeCargo(ISL[ik].material,1); S.hull=tier().hull; toast('🛠️ Sửa bằng vật liệu địa phương — tiết kiệm 35%!'); }
  if(a==='upgrade'){ const nt=TIERS[S.tier+1]; if(nt&&canPay(nt.cost)){ pay(nt.cost); S.tier++; S.hull=tier().hull; refreshShip(); toast(`🎉 Thuyền đã nâng cấp thành <b>${tier().name}</b>!`,5000); } }
  if(a==='craftskin'){ const sk=ISL_SKIN[ik], c={gold:sk.gold,items:sk.items}; if(canPay(c)){ pay(c); S.skins.push(sk.id); S.skin=sk.id; refreshShip(); toast(`🎨 Đã đóng xong <b>${SKINS[sk.id].name}</b>!`); } }
  if(a==='equip'){ S.skin=ds.id; refreshShip(); }
  if(a==='decor'){ const d=DECOR[ds.id]; if(d&&S.gold>=d.price&&!S.decor.includes(ds.id)){ S.gold-=d.price; S.decor.push(ds.id); toast(`${d.icon} Đã mua <b>${d.name}</b> — đã bày trong ${ROOM_NAME[d.room]} trên thuyền!`); } }
  if(a==='upg'){ const u=ROOM_UP[ds.id]; if(u&&S.gold>=u.price&&!S.upg[ds.id]){ S.gold-=u.price; S.upg[ds.id]=true; toast(`${u.icon} Đã nâng cấp <b>${u.name}</b>!`); } }
  if(a==='snackbuy'){ const sn=SNACKS[ik][+ds.i]; if(!S.snack[ik]||S.snack[ik].day!==S.time.day) S.snack[ik]={day:S.time.day,n:0}; const st=S.snack[ik]; if(st.n<3&&S.gold>=sn[2]){ S.gold-=sn[2]; st.n++; S.morale=Math.min(100,S.morale+sn[3]); toast(`${sn[0]} ${sn[1]} ngon tuyệt! Tinh thần +${sn[3]}`); } }
  if(a==='pbait'&&S.gold>=60){ S.gold-=60; S.baitP+=5; }
  if(a==='qtake') acceptQuest(ik,ds.id);
  if(a==='qdone') turnIn(ds.id);
  if(a==='rod'){ const nr=RODS[S.rod+1], c={gold:nr.gold,items:nr.items}; if(canPay(c)){ pay(c); S.rod++; toast(`🎣 Đã mua <b>${nr.name}</b>!`); } }
  if(a==='bait'&&S.gold>=25){ S.gold-=25; S.bait+=10; }
  if(a==='module'){ const m=MODULES[ds.id]; if(m&&canPay(m.cost)&&S.modules.length<SLOTS[S.tier]&&!S.modules.includes(ds.id)){ pay(m.cost); S.modules.push(ds.id); refreshShip(); toast(`🧩 Đã lắp <b>${m.icon} ${m.name}</b> lên thuyền!`,5000); } }
  if(a==='sup'){ const k=ds.k, price=k==='food'?ISL[ik].price.food:ISL[ik].price[k], mx=k==='fuel'?tier().fuel:tier().supply; let n=Math.min(+ds.n,mx-S[k],Math.floor(S.gold/price*100)/100); if(n>0){ S[k]+=n; S.gold=Math.max(0,S.gold-Math.ceil(n*price)); } }
  if(a==='meal'){ const cost=6+4*(S.crew.length+1); if(S.gold>=cost&&S.meal[ik]!==S.time.day){ S.gold-=cost; S.meal[ik]=S.time.day; S.morale=Math.min(100,S.morale+15); toast(`🍲 Cả thuyền ăn một bữa ${ISL[ik].dish} no nê! Tinh thần +15`); } }
  if(a==='hire'){ const list=S.tavern[ik].list, i=list.findIndex(c=>c.id===ds.id); if(i>=0){ const c=list[i]; if(S.gold>=c.fee&&S.crew.length<tier().crew){ S.gold-=c.fee; delete c.fee; S.crew.push(c); list.splice(i,1); S.morale=Math.min(100,S.morale+5); refreshTavern(visOf(ik)); refreshShip(); toast(`🤝 ${c.icon} ${c.species} ${c.name} (${JOBS[c.job].name}) đã lên thuyền!`); if(curSvc==='cand'){ closeModal(); save(); return; } } } }
  if(a==='fire'){ const i=S.crew.findIndex(c=>c.id===ds.id); if(i>=0){ const c=S.crew.splice(i,1)[0]; refreshShip(); toast(`👋 ${c.icon} ${c.species} ${c.name} đã rời thuyền.`); } }
  renderService();
}

let wxBoltT=5, wxSpout=null, zoneObjs=[];
function wxNext(cur){ const o={clear:{cloudy:5,calm:3,fog:1},cloudy:{clear:4,rain:4,fog:2,calm:1},rain:{cloudy:4,thunder:3,clear:1},thunder:{rain:5,cloudy:2},fog:{clear:3,cloudy:3},calm:{clear:4,fog:2,cloudy:2}}[cur]||{clear:1}; return wpick(o); }
function weatherUpdate(dt){
  if(!S.wx) S.wx={type:'clear',left:240}; S.wx.left-=dt;
  if(S.wx.left<=0){ const prev=S.wx.type, n=wxNext(prev); S.wx={type:n,left:150+Math.random()*200}; toast(`${WEATHER[n].icon} Thời tiết đang chuyển: <b>${WEATHER[n].name}</b>`,5000); if((prev==='rain'||prev==='thunder')&&(n==='cloudy'||n==='clear')) rainbowT=50; }
  const tg=WEATHER[S.wx.type], k=1-Math.exp(-dt/25); for(const key in WX) WX[key]=lerp(WX[key],tg[key]||0,k);
  S.wind.str=lerp(S.wind.str,0.15+tg.wind*0.85,1-Math.exp(-dt/30));
  if(WX.rain>0.4&&S.mode==='sea') S.water=Math.min(tier().supply,S.water+dt*0.01*WX.rain);
  if(WX.thunder>0.5&&S.mode==='sea'&&!S.cabin){ wxBoltT-=dt; if(wxBoltT<=0){ wxBoltT=4+Math.random()*9; const a=Math.random()*TAU, d=60+Math.random()*240; bolt(S.ship.x+Math.cos(a)*d,S.ship.z+Math.sin(a)*d); if(d<80&&Math.random()<0.3){ S.hull-=4; toast('⚡ Sét đánh sát thuyền! −4 thân thuyền'); } } }
  if(S.wx.type==='thunder'&&S.mode==='sea'&&!S.cabin&&!wxSpout&&Math.random()<dt*0.02){ const g=makeSpout(); world.add(g); const a=Math.random()*TAU; wxSpout={g,x:S.ship.x+Math.cos(a)*280,z:S.ship.z+Math.sin(a)*280,h:Math.random()*TAU,cd:0}; toast('🌪️ Một cột lốc xoáy xuất hiện ngoài khơi — tránh xa!',5000); }
  if(wxSpout){ const q=wxSpout; q.h+=(Math.random()-.5)*dt*0.5; q.x+=Math.sin(q.h)*9*dt; q.z-=Math.cos(q.h)*9*dt; q.cd-=dt; const d=Math.hypot(q.x-S.ship.x,q.z-S.ship.z);
    if(d<24&&q.cd<=0&&S.mode==='sea'&&!S.cabin){ q.cd=15; S.hull-=10; shake=1; banner('🌪️ Lốc xoáy quét qua thuyền! (−10)'); }
    if(S.wx.type!=='thunder'||d>800){ world.remove(q.g); wxSpout=null; } else { q.g.position.set(q.x,0,q.z); spoutUpdate(q.g,T); } }
}
function genZones(){ const r=mulberry32(S.seed+999), z=[]; const add=(type,n,rmin,rmax)=>{ for(let i=0;i<n;i++) for(let t=0;t<300;t++){ const x=(r()*2-1)*(WORLD-120), zz=(r()*2-1)*(WORLD-120), rad=rmin+r()*(rmax-rmin);
    if(S.islands.every(s=>Math.hypot(s.x-x,s.z-zz)>ISL[s.k].R+rad+130)&&z.every(o=>Math.hypot(o.x-x,o.z-zz)>o.r+rad+60)){ z.push({type,x:Math.round(x),z:Math.round(zz),r:Math.round(rad),dir:r()*TAU}); break; } } };
  add('current',7,110,190); add('glow',3,90,140); add('whirl',2,45,60); add('warm',3,90,140); return z; }
function zoneAt(x,z){ if(!S||!S.zones) return null; for(const o of S.zones) if(Math.hypot(o.x-x,o.z-z)<o.r) return o; return null; }
function buildZones(){ zoneObjs=[]; for(const o of (S.zones||[])){ const g=new THREE.Group(); g.position.set(o.x,0,o.z); world.add(g); const zo={o,g};
  if(o.type==='current'){ const N=55, geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*6),3)); const ls=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0xdff6ff,transparent:true,opacity:0.55})); ls.frustumCulled=false; g.add(ls); zo.ls=ls; zo.p=Array.from({length:N},()=>({u:(Math.random()*2-1)*o.r,v:(Math.random()*2-1)*o.r*0.7,l:4+Math.random()*7})); }
  if(o.type==='glow'||o.type==='warm'){ const N=o.type==='glow'?280:130, pa=new Float32Array(N*3); for(let i=0;i<N;i++){ const a=Math.random()*TAU, rr=Math.sqrt(Math.random())*o.r; pa.set([Math.cos(a)*rr,0.4,Math.sin(a)*rr],i*3); } const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pa,3));
    zo.pts=new THREE.Points(geo,new THREE.PointsMaterial({color:o.type==='glow'?0x5affe0:0xffc070,size:o.type==='glow'?1.5:1.1,map:DOT_TEX,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false})); zo.pts.frustumCulled=false; g.add(zo.pts); zo.puffT=0; }
  if(o.type==='whirl'){ zo.rings=[]; for(let i=0;i<7;i++){ const rr=o.r*(0.15+i*0.13), t=new THREE.Mesh(new THREE.TorusGeometry(rr,0.6+i*0.15,4,48),new THREE.MeshBasicMaterial({color:0xeaf6ff,transparent:true,opacity:0.5-i*0.05,depthWrite:false})); t.rotation.x=Math.PI/2; t.position.y=-2.5+i*0.45; g.add(t); zo.rings.push(t); }
    const c=new THREE.Mesh(new THREE.CircleGeometry(o.r*0.18,24).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x06203a,transparent:true,opacity:0.85})); c.position.y=-2.3; g.add(c); }
  zoneObjs.push(zo); } }
function zonesVisual(dt){ for(const zo of zoneObjs){ const o=zo.o, d=Math.hypot(o.x-camera.position.x,o.z-camera.position.z); zo.g.visible=d<o.r+700; if(!zo.g.visible) continue;
  if(zo.ls){ const ux=Math.sin(o.dir), uz=-Math.cos(o.dir), a=zo.ls.geometry.attributes.position.array; zo.p.forEach((q,j)=>{ q.u+=dt*14; if(q.u>o.r) q.u-=2*o.r; const x=q.u*ux-q.v*uz, z=q.u*uz+q.v*ux; if(Math.hypot(x,z)>o.r){ a.fill(0,j*6,j*6+6); return; } const y=waveH(o.x+x,o.z+z,T)+0.4; a.set([x,y,z,x+ux*q.l,y,z+uz*q.l],j*6); }); zo.ls.geometry.attributes.position.needsUpdate=true; }
  if(o.type==='glow') zo.pts.material.opacity=0.12+0.8*nightNow;
  if(zo.rings) zo.rings.forEach((t,i)=>t.rotation.z+=dt*(1.8-i*0.17));
  if(o.type==='warm'){ zo.puffT-=dt; if(zo.puffT<=0&&d<o.r+250){ zo.puffT=1.2; const a=Math.random()*TAU, rr=Math.random()*o.r; puff(o.x+Math.cos(a)*rr,1,o.z+Math.sin(a)*rr,0xffffff,1.6,4,2); } } } }

function advanceTime(days){ S.time.t+=days; while(S.time.t>=1){ S.time.t-=1; newDay(); } }
function newDay(){
  S.time.day++; const n=S.crew.length+1, cook=jobLv('cook'), carp=jobLv('carp'), foodNeed=n*(1-Math.min(0.6,cook*0.15+(S.upg.kitchen2?0.15:0))), waterNeed=n;
  let dm=-2+cook*1.5; const msgs=[];
  if(S.food>=foodNeed) S.food-=foodNeed; else { S.food=0; dm-=15; msgs.push('🍞 Hết đồ ăn!'); }
  if(S.water>=waterNeed) S.water-=waterNeed; else { S.water=0; dm-=20; msgs.push('💧 Hết nước!'); }
  const wages=S.crew.reduce((a,c)=>a+c.wage,0); if(wages>0){ if(S.gold>=wages) S.gold-=wages; else { S.gold=0; dm-=12; msgs.push('💸 Thiếu tiền trả lương!'); } }
  for(const c of S.crew) if(S.cargo[c.fav]) dm+=1;
  dm+=Math.min(5,S.decor.reduce((a,id)=>a+((DECOR[id]&&DECOR[id].comfort)||0),0)*0.5)+(S.upg.bed2?2:0);
  for(const q of [...S.quests]) if(S.time.day>q.deadline){ S.quests=S.quests.filter(x=>x!==q); S.rep[q.ik]=Math.max(0,(S.rep[q.ik]||0)-3); toast(`⌛ Nhiệm vụ <b>${q.title}</b> đã hết hạn (-3⭐).`); for(const v of islandVis) refreshCollectibles(v); }
  if(S.modules.includes('farm')){ S.food=Math.min(tier().supply,S.food+2); S.water=Math.max(0,S.water-0.5); msgs.push('🥬 +2 rau'); }
  if(S.modules.includes('herb')&&cargoUsed()<cargoCap()){ addCargo('thao',1); msgs.push('🍃 +1 thảo dược'); }
  if(S.modules.includes('aquarium')&&Object.keys(S.cargo).some(id=>ITEMS[id].fish)) dm+=1;
  if(dm<0) dm*=1-Math.min(0.5,jobLv('doc')*0.12); S.morale=clamp(S.morale+dm,0,100);
  if(carp>0) S.hull=Math.min(tier().hull,S.hull+4*carp);
  for(const id in S.cargo) if(ITEMS[id].perish&&!(ITEMS[id].fish&&S.modules.includes('aquarium'))) S.cargo[id].f=Math.max(0.1,S.cargo[id].f-0.15);
  for(const ik in S.market) for(const id in S.market[ik]){ const m=S.market[ik][id]; m.sat+=(1-m.sat)*0.25; if(m.stock!==undefined) m.stock=Math.min(30,m.stock+5); if(S.time.day%3===0) m.noise=lerp(m.noise,0.85+Math.random()*0.3,0.6); }
  S.wind.dir+=(Math.random()-.5)*1.6; S.wind.str=0.5+Math.random()*0.5;
  toast(`☀️ Ngày ${S.time.day}`+(wages?` · trả lương ${wages}💰`:'')+(msgs.length?' · '+msgs.join(' '):''));
  if(S.morale<30) toast('😟 Tinh thần thuyền viên đang thấp — họ có thể bỏ đi ở đảo kế tiếp.');
  save();
}
function sink(){
  const disc=S.islands.filter(i=>i.disc); let best=disc[0], bd=1e9; for(const i of disc){ const d=Math.hypot(i.x-S.ship.x,i.z-S.ship.z); if(d<bd){bd=d;best=i;} }
  const lostGold=Math.floor(S.gold*0.5); S.cargo={}; S.gold-=lostGold; S.hull=Math.round(tier().hull*0.3); S.fuel=Math.max(S.fuel,tier().fuel*0.3); S.food=Math.max(S.food,3); S.water=Math.max(S.water,3); S.morale=Math.max(20,S.morale-20);
  const a=Math.random()*TAU, R=ISL[best.k].R; S.ship.x=best.x+Math.sin(a)*(R+55); S.ship.z=best.z-Math.cos(a)*(R+55); S.ship.speed=0; S.ship.thr=0; S.ship.h=a; cleanupEventVis();
  eventModal('Thuyền bị chìm!','💥',`Thân thuyền vỡ nát và chìm xuống biển sâu… Dân đảo ${ISL[best.k].name} đã vớt được bạn và kéo thuyền về sửa tạm. Mất toàn bộ hàng hóa và ${lostGold}💰.`,[['ok','Làm lại từ đầu']],()=>{ closeModal(); save(); });
}

    camera.position.lerp(_v3.set(tx,ty,tz),k); camera.lookAt(sh.x,6,sh.z); return;
  }
  const vis=visOf(S.land.k), L=vis.L, isl=vis.isl;
  if(svcFocus){ const np=svcFocus.ch.root.getWorldPosition(_v3b); const dx=S.land.x-np.x, dz=S.land.z-np.z, dl=Math.hypot(dx,dz)||1, ux=dx/dl, uz=dz/dl;
    const tx=np.x+ux*6.5+(-uz)*1.5, tz=np.z+uz*6.5+ux*1.5; camera.position.lerp(_v3.set(tx,np.y+3.4,tz),k);
    const fxv=-ux, fzv=-uz, rx=-fzv, rz=fxv; camera.lookAt(np.x+rx*1.9,np.y+2.1,np.z+rz*1.9); return; }
  const py=groundAt(L,S.land.x-isl.x,S.land.z-isl.z).y, cd=landCam.dist*Math.cos(landCam.pitch);

}

          :it.kind==='collect'?`Nhấn <kbd>E</kbd> — nhặt ✨ <b>${COLLECT[S.land.k].title}</b>`:`Nhấn <kbd>E</kbd> — chào ${SPECIES[it.res.look.sp].ic} <b>${it.res.name}</b>`; }
      p.style.display=msg?'block':'none'; p.innerHTML=msg;
      if(S.mode==='sea'&&!S.cabin) updateDeckCargo();
      mapTimer-=0.1; if(mapTimer<=0){ mapTimer=0.3; if(S.mode==='land'&&!S.cabin) drawIslandMap($('mini'),visOf(S.land.k),false); else drawMap($('mini'),false); if(modalKind==='map'&&$('bigmap')) drawMap($('bigmap'),true); } }
  }

}
